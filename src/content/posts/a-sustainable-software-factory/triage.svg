<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 48 760 282" role="img" aria-label="Triage: five channels, one triage, one human">
<defs><marker id="tri-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="viz-arrowhead" d="M0 0L10 5L0 10z"/></marker></defs>
<g class="viz-edge"><path d="M164 82L212 130" marker-end="url(#tri-arrow)"/><path d="M164 130L212 154" marker-end="url(#tri-arrow)"/><path d="M164 178L212 178" marker-end="url(#tri-arrow)"/><path d="M164 226L212 202" marker-end="url(#tri-arrow)"/><path d="M164 274L212 226" marker-end="url(#tri-arrow)"/><path d="M404 178H442" marker-end="url(#tri-arrow)"/><path d="M604 178L628 86" marker-end="url(#tri-arrow)"/><path d="M604 178L628 148" marker-end="url(#tri-arrow)"/><path d="M604 178L628 210" marker-end="url(#tri-arrow)"/><path d="M604 178L628 272" marker-end="url(#tri-arrow)"/></g>
<g><rect class="viz-box" x="24" y="64" width="140" height="36" rx="8"/><text class="viz-text" x="94" y="87" text-anchor="middle">In-app reports</text></g>
<g><rect class="viz-box" x="24" y="112" width="140" height="36" rx="8"/><text class="viz-text" x="94" y="135" text-anchor="middle">Error store</text></g>
<g><rect class="viz-box" x="24" y="160" width="140" height="36" rx="8"/><text class="viz-text" x="94" y="183" text-anchor="middle">GitHub issues</text></g>
<g><rect class="viz-box" x="24" y="208" width="140" height="36" rx="8"/><text class="viz-text" x="94" y="231" text-anchor="middle">Reddit threads</text></g>
<g><rect class="viz-box" x="24" y="256" width="140" height="36" rx="8"/><text class="viz-text" x="94" y="279" text-anchor="middle">YouTube comments</text></g>
<g><rect class="viz-box" x="214" y="96" width="190" height="164" rx="8"/><text class="viz-label" x="309" y="122" text-anchor="middle">Triage agent</text><text class="viz-note" x="309" y="148" text-anchor="middle">reads every report in full</text><text class="viz-note" x="309" y="170" text-anchor="middle">classifies by what it says</text><text class="viz-note" x="309" y="192" text-anchor="middle">clusters repeat asks</text><text class="viz-note" x="309" y="214" text-anchor="middle">flags reports with no specifics</text><text class="viz-note" x="309" y="236" text-anchor="middle">ranks what matters most</text></g>
<g><rect class="viz-box viz-box--main" x="444" y="124" width="160" height="108" rx="8"/><text class="viz-label" x="524" y="148" text-anchor="middle">Highly contextualized</text><text class="viz-label" x="524" y="165" text-anchor="middle">human</text><text class="viz-note viz-note--main" x="524" y="187" text-anchor="middle">vision, taste</text><text class="viz-note viz-note--main" x="524" y="204" text-anchor="middle">and judgement:</text><text class="viz-note viz-note--main" x="524" y="221" text-anchor="middle">fix, build, park or no</text></g>
<g><rect class="viz-box" x="630" y="64" width="122" height="44" rx="8"/><text class="viz-label" x="691" y="83" text-anchor="middle">Linear ticket</text><text class="viz-note" x="691" y="99" text-anchor="middle">written as a brief</text></g>
<g><rect class="viz-box" x="630" y="126" width="122" height="44" rx="8"/><text class="viz-label" x="691" y="145" text-anchor="middle">Report stamped</text><text class="viz-note" x="691" y="161" text-anchor="middle">with its status</text></g>
<g><rect class="viz-box" x="630" y="188" width="122" height="44" rx="8"/><text class="viz-label" x="691" y="207" text-anchor="middle">Parked</text><text class="viz-note" x="691" y="223" text-anchor="middle">returns next session</text></g>
<g><rect class="viz-box" x="630" y="250" width="122" height="44" rx="8"/><text class="viz-label" x="691" y="269" text-anchor="middle">Declined</text><text class="viz-note" x="691" y="285" text-anchor="middle">with a note</text></g>
</svg>
