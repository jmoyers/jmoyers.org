<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 48 760 296" role="img" aria-label="The loop: a human sits in the loop twice, before the build and before the release">
<defs><marker id="loop-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="viz-arrowhead" d="M0 0L10 5L0 10z"/></marker></defs>
<g class="viz-edge"><path d="M184 116H208" marker-end="url(#loop-arrow)"/><path d="M368 116H392" marker-end="url(#loop-arrow)"/><path d="M552 116H576" marker-end="url(#loop-arrow)"/><path d="M656 160V232" marker-end="url(#loop-arrow)"/><path d="M576 276H552" marker-end="url(#loop-arrow)"/><path d="M392 276H368" marker-end="url(#loop-arrow)"/><path d="M208 276H184" marker-end="url(#loop-arrow)"/><path d="M104 232V160" marker-end="url(#loop-arrow)"/></g>
<g><rect class="viz-box" x="24" y="72" width="160" height="88" rx="8"/><text class="viz-label" x="104" y="96" text-anchor="middle">Player</text><text class="viz-note" x="104" y="116" text-anchor="middle">hits a bug or</text><text class="viz-note" x="104" y="132" text-anchor="middle">wants a feature</text></g>
<g><rect class="viz-box" x="208" y="72" width="160" height="88" rx="8"/><text class="viz-label" x="288" y="96" text-anchor="middle">Report</text><text class="viz-note" x="288" y="116" text-anchor="middle">in-app, Reddit,</text><text class="viz-note" x="288" y="132" text-anchor="middle">YouTube, GitHub,</text><text class="viz-note" x="288" y="148" text-anchor="middle">crash reports</text></g>
<g><rect class="viz-box" x="392" y="72" width="160" height="88" rx="8"/><text class="viz-label" x="472" y="96" text-anchor="middle">Triage agent</text><text class="viz-note" x="472" y="116" text-anchor="middle">pulls every channel,</text><text class="viz-note" x="472" y="132" text-anchor="middle">clusters repeats,</text><text class="viz-note" x="472" y="148" text-anchor="middle">ranks what matters</text></g>
<g><rect class="viz-box viz-box--main" x="576" y="72" width="160" height="88" rx="8"/><text class="viz-label" x="656" y="94" text-anchor="middle">Highly contextualized</text><text class="viz-label" x="656" y="110" text-anchor="middle">human</text><text class="viz-note viz-note--main" x="656" y="130" text-anchor="middle">accepts, rejects or</text><text class="viz-note viz-note--main" x="656" y="146" text-anchor="middle">changes the strategy</text></g>
<g><rect class="viz-box" x="576" y="232" width="160" height="88" rx="8"/><text class="viz-label" x="656" y="256" text-anchor="middle">Ticket</text><text class="viz-note" x="656" y="276" text-anchor="middle">written as a brief</text><text class="viz-note" x="656" y="292" text-anchor="middle">an agent can build</text><text class="viz-note" x="656" y="308" text-anchor="middle">with no history</text></g>
<g><rect class="viz-box" x="392" y="232" width="160" height="88" rx="8"/><text class="viz-label" x="472" y="256" text-anchor="middle">Agents build</text><text class="viz-note" x="472" y="276" text-anchor="middle">1-5 coding agents,</text><text class="viz-note" x="472" y="292" text-anchor="middle">then automated</text><text class="viz-note" x="472" y="308" text-anchor="middle">checks and tests</text></g>
<g><rect class="viz-box viz-box--main" x="208" y="232" width="160" height="88" rx="8"/><text class="viz-label" x="288" y="254" text-anchor="middle">Highly contextualized</text><text class="viz-label" x="288" y="270" text-anchor="middle">human</text><text class="viz-note viz-note--main" x="288" y="290" text-anchor="middle">uses every feature in</text><text class="viz-note viz-note--main" x="288" y="306" text-anchor="middle">depth before release</text></g>
<g><rect class="viz-box" x="24" y="232" width="160" height="88" rx="8"/><text class="viz-label" x="104" y="256" text-anchor="middle">Release published</text><text class="viz-note" x="104" y="276" text-anchor="middle">built and signed</text><text class="viz-note" x="104" y="292" text-anchor="middle">automatically; the</text><text class="viz-note" x="104" y="308" text-anchor="middle">app updates itself</text></g>
<text class="viz-note" x="114" y="192">release notes mark</text><text class="viz-note" x="114" y="208">it “player report”</text>
<text class="viz-note" x="646" y="200" text-anchor="end">accepted items</text>
</svg>
